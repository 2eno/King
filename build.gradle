// Every Gradle plugin lives on the root build classpath so the Kotlin plugin and the Android
// plugin share one classloader. The Android plugin is only added when the :app module is built.
buildscript {
    def skipAndroid = (findProperty('monsterMayor.skipAndroid') ?: 'false').toBoolean()

    repositories {
        mavenCentral()
        google {
            content {
                includeGroupByRegex 'com\\.android.*'
                includeGroupByRegex 'com\\.google\\.android.*'
                includeGroupByRegex 'com\\.google\\.testing.*'
                includeGroupByRegex 'androidx.*'
            }
        }
        gradlePluginPortal()
    }

    dependencies {
        classpath libs.kotlin.gradle.plugin
        classpath libs.kotlin.serialization.gradle.plugin
        classpath libs.kotlin.compose.gradle.plugin
        classpath libs.ksp.gradle.plugin
        if (!skipAndroid) {
            classpath libs.android.gradle.plugin
        }
    }
}
